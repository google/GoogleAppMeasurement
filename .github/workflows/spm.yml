name: spm

permissions:
  contents: read

on:
  pull_request:
  schedule:
    # Run every day at 11pm (PST) - cron uses UTC times
    - cron:  '0 7 * * *'

jobs:
  swift-build-run:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
    - name: Initialize xcodebuild
      run: xcodebuild -list
    - name: Verify iOS build
      run:  xcodebuild -destination 'generic/platform=iOS' -scheme GoogleAppMeasurement-Package
    - name: Verify tvOS build
      run:  xcodebuild -destination 'generic/platform=tvOS' -scheme GoogleAppMeasurement-Package
    - name: Verify macOS build
      run:  xcodebuild -destination 'generic/platform=macOS' -scheme GoogleAppMeasurement-Package
